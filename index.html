<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribución · Sopena Logística</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f3;--ink:#13222d;--mut:#5d6d78;--line:#d4dbe0;--navy:#0f2a3d;--amb:#e0a100;--ok:#1f7a55;--bad:#b3261e;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.n{font-family:"Barlow Semi Condensed",sans-serif;margin:0}h2{font-size:17px;margin-bottom:8px}
[hidden]{display:none!important}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:14px;align-items:end;flex-wrap:wrap}
header h1{font-size:22px;margin-right:auto}label{display:grid;gap:2px;font-size:12px;color:#b9c7d0}
input,select,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--amb);border-color:var(--amb);font-weight:600}button.s{background:#fff;border-color:var(--line);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:18px;padding:18px 20px}
section{background:var(--card);padding:14px 16px;border-left:4px solid var(--navy)}section.w{border-color:var(--amb)}section.full{grid-column:1/-1}
.bar{height:10px;background:#e4e9ec;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.x{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.mut{color:var(--mut);font-size:13px}.n{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#fff}
.tw{max-height:55vh;overflow:auto}.tag{padding:1px 6px;border-radius:3px;background:#e4e9ec;font-size:12px}.tag.sa{background:#fde7c2}.tag.in{background:#cfe9dd}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px;background:#fff;padding:22px}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body>
<form id="login" hidden><h1>Sopena Logística</h1><input id="em" type="email" placeholder="Correo" required><input id="pw" type="password" placeholder="Contraseña" required><button>Entrar</button><span id="err" class="mut"></span></form>
<div id="app" hidden>
<header><h1>Distribución</h1>
<label>Fecha del Excel<input type="date" id="carga"></label>
<label>Planificar para<input type="date" id="plan"></label>
<label>Maestro de rutas<input type="file" id="maestro" accept=".json,.xlsx,.xls"></label>
<label>Excel de pendientes<input type="file" id="file" accept=".xlsx,.xls"></label>
<button id="calc">Calcular distribución</button><button class="s" id="out">Salir</button></header>
<main>
<section><h2>Carga por chófer</h2><div id="chof"></div></section>
<section><h2>Resumen</h2><div id="res"></div></section>
<section class="w"><h2>Rutas por decidir</h2><div id="dec"></div></section>
<section class="w"><h2>Posible resto: cerrar la línea</h2><div id="avi"></div></section>
<section class="full"><h2>Líneas <select id="fil"></select> <span class="mut" id="cnt"></span></h2><div class="tw"><table id="tab"></table></div></section>
</main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {initializeFirestore,doc,getDoc,setDoc,collection,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import {aplicarReglas,CONFIG_INICIAL,cargaUtil} from "./motor.js";
import {construirIndice,claveDecision,claveCliente} from "./asignador.js";
import {procesarPendientes} from "./pendientes.js";

const app=initializeApp({apiKey:"AIzaSyDwu4mssapj1kTQfL9-ABBcj_HIy-JGZxQ",authDomain:"hoja-de-rutas-e778d.firebaseapp.com",projectId:"hoja-de-rutas-e778d",storageBucket:"hoja-de-rutas-e778d.firebasestorage.app",messagingSenderId:"1092143386440",appId:"1:1092143386440:web:e6b80eb924c2d7d7956d7d"});
const auth=getAuth(app),db=initializeFirestore(app,{ignoreUndefinedProperties:true});
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nul=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v===undefined?null:v]));
const kg=n=>Math.round(n).toLocaleString("es-ES");
let cfg,decisiones={},indice,pedidos=[],unsub;
const iso=d=>d.toISOString().slice(0,10),hoy=new Date();
$("#carga").value=iso(hoy);$("#plan").value=iso(new Date(hoy.getTime()+864e5));

$("#login").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch{$("#err").textContent="Correo o contraseña incorrectos."}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u)iniciar();else unsub?.()});

async function iniciar(){
  const cs=doc(db,"config","main"),ds=doc(db,"decisiones","main");
  let c=await getDoc(cs);if(!c.exists()){await setDoc(cs,CONFIG_INICIAL);c=await getDoc(cs)}cfg=c.data();
  let d=await getDoc(ds);if(!d.exists()){await setDoc(ds,await(await fetch("./decisiones-rutas.json")).json());d=await getDoc(ds)}decisiones=d.data();
  const m=await getDoc(doc(db,"maestro","clientes"));indice=m.exists()?construirIndice(m.data().filas):null;
  $("#fil").innerHTML=[["sa","Sin asignar"],["sr","Sin ruta"],["av","Posible resto"],["all","Todas"]].map(([v,t])=>`<option value="${v}">${t}</option>`).join("");
  $("#fil").onchange=pintar;$("#carga").onchange=escuchar;escuchar();
}
function escuchar(){unsub?.();unsub=onSnapshot(collection(db,"cargas",$("#carga").value,"pedidos"),s=>{pedidos=s.docs.map(x=>x.data());pintar()})}
async function guardar(ops){
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);
    ops.slice(i,i+400).forEach(o=>{const r=doc(db,"cargas",$("#carga").value,"pedidos",o.id);o.del?b.delete(r):b.set(r,nul(o.data),{merge:true})});await b.commit()}
}
const planificable=p=>p.estatus==="Pendiente de generar albaranes"&&p.barEmp>0&&p.ruta;

$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!indice){alert("Carga primero el maestro de rutas.");e.target.value="";return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    const nuevos=procesarPendientes(filas,$("#carga").value,indice,decisiones),prev=new Map(pedidos.map(p=>[p.id,p])),ids=new Set(nuevos.map(p=>p.id));
    const ops=nuevos.map(p=>{const{status,asignadoA,asignadoNombre,proveedor,...resto}=p;return{id:p.id,data:prev.get(p.id)?.manual?resto:p}});
    pedidos.filter(p=>!ids.has(p.id)).forEach(p=>ops.push({id:p.id,del:true}));
    await guardar(ops);alert(`${nuevos.length} líneas importadas.`);
  }catch(err){alert("No se pudo importar: "+err.message)}
  e.target.value="";
};
$("#maestro").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{let filas;
    if(f.name.endsWith(".json"))filas=JSON.parse(await f.text());
    else{const wb=XLSX.read(await f.arrayBuffer()),vistos=new Set(),t=x=>String(x??"").replace(/\s+/g," ").trim();
      filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}).slice(1).filter(x=>x[5]).map(x=>({cp:typeof x[0]==="number"?String(x[0]).padStart(5,"0"):t(x[0]),localidad:t(x[1]),direccion:t(x[2]),codigo:t(x[3]),cliente:t(x[4]),ruta:t(x[5]).toUpperCase(),zona:t(x[6]).toUpperCase()})).filter(x=>{const k=JSON.stringify(x);return !vistos.has(k)&&vistos.add(k)})}
    await setDoc(doc(db,"maestro","clientes"),{filas,actualizado:new Date().toISOString()});
    indice=construirIndice(filas);pintar();alert(`Maestro cargado: ${filas.length} filas.`)
  }catch(err){alert("No se pudo cargar el maestro: "+err.message)}
  e.target.value="";
};
$("#calc").onclick=async()=>{
  const res=aplicarReglas(pedidos.filter(planificable),cfg,$("#plan").value);
  await guardar(res.filter(p=>!p.manual).map(p=>({id:p.id,data:{ruta:p.ruta,zona:p.zona,status:p.status,asignadoA:p.asignadoA,asignadoNombre:p.asignadoNombre,proveedor:p.proveedor,motivoSinAsignar:p.motivoSinAsignar,observaciones:p.observaciones,alerta:p.alerta}})));
};
async function decidir(clave,ruta,cliente){
  decisiones[clave]=ruta;await setDoc(doc(db,"decisiones","main"),{[clave]:ruta},{merge:true});
  await guardar(pedidos.filter(p=>!p.ruta&&(cliente?claveCliente(p):claveDecision(p))===clave).map(p=>({id:p.id,data:{ruta,metodoRuta:"decision",rutasCandidatas:null}})));
}
async function asignarManual(id,v){
  const d=cfg.drivers.find(x=>x.id===v),b={asignadoA:null,asignadoNombre:null,proveedor:null};
  const m={auto:{manual:false},LGM:{manual:true,status:"subcontratado",proveedor:"LGM",asignadoNombre:"LGM"},recoge:{manual:true,status:"recoge",asignadoNombre:"Cliente recoge"},pend:{manual:true,status:"sin_asignar"}};
  await guardar([{id,data:m[v]?{...b,...m[v]}:{...b,manual:true,status:"interno",asignadoA:d.id,asignadoNombre:d.nombre}}]);
}
const rutasOpt=()=>cfg.rutas.map(r=>`<option>${r.codigo}</option>`).join("");

function pintar(){
  if(!cfg)return;
  const horas=r=>Math.min(cfg.horasOverride?.[r]??cfg.rutas.find(x=>x.codigo===r)?.horas??0,8);
  $("#chof").innerHTML=cfg.drivers.filter(d=>d.tipo==="INTERNO"&&d.activo!==false).map(d=>{
    const l=pedidos.filter(p=>p.status==="interno"&&p.asignadoA===d.id),k=l.reduce((a,p)=>a+(p.kgs||0),0),rs=[...new Set(l.map(p=>p.ruta))],h=rs.reduce((a,r)=>a+horas(r),0),pc=k/cargaUtil(d)*100;
    return`<div><div class="row" style="border:0"><b>${esc(d.nombre)}</b><span class="mut">${rs.join(", ")||"sin ruta"} · ${h} h</span></div><div class="bar"><i class="${pc>100?"x":""}" style="width:${Math.min(pc,100)}%"></i></div><div class="mut" style="margin-top:-6px">${kg(k)} / ${kg(cargaUtil(d))} kg</div></div>`}).join("");
  const c=s=>pedidos.filter(p=>p.status===s).length;
  $("#res").innerHTML=[["Interno",c("interno")],["Subcontratado (LGM)",c("subcontratado")],["Recoge cliente",c("recoge")],["Export",c("export")],["Sin asignar",c("sin_asignar")],["Kg embalados",kg(pedidos.reduce((a,p)=>a+(p.kgs||0),0))]].map(([t,v])=>`<div class="row"><span>${t}</span><span class="n">${v}</span></div>`).join("");
  const g=new Map();pedidos.filter(p=>!p.ruta).forEach(p=>{const cl=p.metodoRuta==="sin_cliente",k=cl?claveCliente(p):claveDecision(p);g.set(k,{p,cl,n:(g.get(k)?.n||0)+1})});
  $("#dec").innerHTML=(indice?"":"<p><b>Falta el maestro de rutas.</b> Cárgalo con el botón de arriba.</p>")+[...g].map(([k,{p,cl,n}])=>`<div class="row"><span>${esc(p.cliente)}<br><span class="mut">${cl?"No está en el maestro":esc(p.domicilio.slice(0,48))+" · candidatas "+(p.rutasCandidatas||[]).join("/")} · ${n} líneas</span></span><select data-k="${esc(k)}" data-c="${cl}"><option value="">Ruta…</option>${rutasOpt()}</select></div>`).join("")||'<span class="mut">Todas las líneas tienen ruta.</span>';
  const av=pedidos.filter(p=>p.avisoResto&&!p.cerradaApp&&!p.cerrada);
  $("#avi").innerHTML=av.map(p=>`<div class="row"><span>${esc(p.cliente)} · ${p.pedido}-${p.linea}<br><span class="mut">Pedidas ${p.barPedidas}, embaladas ${p.barEmp}: faltan ${p.avisoResto.falta} (${(p.avisoResto.pct*100).toFixed(1)}%)</span></span><button class="s" data-cerrar="${esc(p.id)}">Cerrar</button></div>`).join("")||'<span class="mut">Sin avisos.</span>';
  const f=$("#fil").value,l=pedidos.filter(p=>f==="all"||(f==="sa"&&p.status==="sin_asignar")||(f==="sr"&&!p.ruta)||(f==="av"&&p.avisoResto&&!p.cerradaApp&&!p.cerrada)).slice(0,400);
  $("#cnt").textContent=`${l.length} mostradas (máx. 400)`;
  $("#tab").innerHTML="<tr><th>Cliente<th>Pedido<th>Ruta<th>Kg<th>Barras<th>Asignación<th>Motivo</tr>"+l.map(p=>{
    const v=p.manual?(p.status==="interno"?p.asignadoA:p.status==="subcontratado"?"LGM":p.status==="recoge"?"recoge":"pend"):"auto";
    return`<tr><td>${esc(p.cliente)}<td>${p.pedido}-${p.linea}<td>${p.ruta||"?"}<td>${kg(p.kgs||0)}<td>${p.barEmp}/${p.barPedidas}<td><select data-m="${esc(p.id)}"><option value="auto">${esc(p.asignadoNombre||"Sin asignar")} (auto)</option>${cfg.drivers.filter(d=>d.tipo==="INTERNO").map(d=>`<option value="${d.id}">${esc(d.nombre)}</option>`).join("")}<option value="LGM">LGM</option><option value="recoge">Cliente recoge</option><option value="pend">Sin asignar</option></select><td class="mut">${esc(p.motivoSinAsignar||"")}`}).join("");
  l.forEach(p=>{const s=$(`#tab select[data-m="${CSS.escape(p.id)}"]`);if(s&&p.manual)s.value=p.status==="interno"?p.asignadoA:p.status==="subcontratado"?"LGM":p.status==="recoge"?"recoge":"pend"});
}
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.k!==undefined&&t.value)decidir(t.dataset.k,t.value,t.dataset.c==="true");
  if(t.dataset.m)asignarManual(t.dataset.m,t.value)});
document.addEventListener("click",e=>{const id=e.target.dataset.cerrar;if(id)guardar([{id,data:{cerradaApp:true}}])});
</script></body></html>
